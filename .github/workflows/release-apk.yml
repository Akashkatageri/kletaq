name: Build & Release Benchmark APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Benchmark APK
        run: ./gradlew assembleBenchmark --no-daemon

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/benchmark/kletaq-benchmark.apk release-output/kletaq.apk

      - name: Update GitHub 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Kletaq Latest Build"
          body: "Automated release build of Kletaq (Benchmark variant)."
          draft: false
          prerelease: false
          files: release-output/kletaq.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
