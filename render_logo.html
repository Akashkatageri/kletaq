<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Klytaq Exact Logo</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    .logo-container {
      width: 400px;
      height: 400px;
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h2>Klytaq Exact Logo Vector Render</h2>
  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
      <defs>
        <linearGradient id="leftPillarGrad" x1="38" y1="32" x2="46" y2="76" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#7C3AED" />
          <stop offset="100%" stop-color="#A855F7" />
        </linearGradient>

        <linearGradient id="topArmGrad" x1="46" y1="32" x2="75" y2="57" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#A855F7" />
          <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>

        <linearGradient id="bottomArmGrad" x1="44" y1="51" x2="71" y2="76" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38BDF8" />
          <stop offset="100%" stop-color="#818CF8" />
        </linearGradient>
      </defs>

      <!-- Circular Dark Obsidian Background -->
      <circle cx="54" cy="54" r="54" fill="#0F0E17" />

      <!-- Left Vertical Pillar of K -->
      <path d="M38,32h8v44h-8z" fill="url(#leftPillarGrad)" />

      <!-- Top Diagonal Arm of K -->
      <path d="M46,50 L66,32 h9 L53,57 z" fill="url(#topArmGrad)" />

      <!-- Bottom Diagonal Arm of K -->
      <path d="M48,51 L71,76 h-9 L44,55 z" fill="url(#bottomArmGrad)" />

      <!-- Minimalist Glow Dot Accent -->
      <circle cx="73" cy="30" r="3" fill="#38BDF8" />
    </svg>
  </div>
</body>
</html>
